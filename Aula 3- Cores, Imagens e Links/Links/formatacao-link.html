<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale= 1.0">
    <title>Formatar os links</title>
    <style>
        body{
            background-color: black;
        }
        h1 {
            color: hotpink;
        }
        /* Link normal */
        a:link {
            color:blue;
            text-decoration:none;
        }
        /*Link ja visitado*/
        a:visited {
            color:yellow;
        }
        /* Mouse por cima do link*/
        a:hover{
            color:red;
            text-decoration: underline;
            font-size:100px 
        }
        /* Enquanto o link é clicado*/
        a:active{
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Formatação de links com CSS</h1>
    <p><a href="#1">Formatação de Links</a></p>
</body>
</html>
