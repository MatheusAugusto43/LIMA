<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados de contato</title>
    <style>
        main {
            border: 1px solid black;
            width: 200px;
            padding: 10px;
            background-color: lightskyblue;
        }

        body {
            background-color: #B8EBF0;
        }
    </style>
</head>

<body>
    <main>
        <form action="Registro.html">
            <p><label>Nome:</label></p>
            <input type="text" name="nome" required placeholder="Digite seu nome">
            <br>
            <p><label>Email:</label></p>
            <input type="email" name="email" required placeholder="Digite seu email">
            <br>
            <p><label>Telefone:</label></p>
            <input type="text" name="Telefone" required placeholder="Digite seu telefone"
                title="Use o formato (99) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
            <br>
            <br>
            <input type="submit" value="Enviar">
    </main>
</body>

</html>
