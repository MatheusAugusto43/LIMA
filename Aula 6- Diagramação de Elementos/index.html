<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 5px solid black;
            width: 400px;
            height: 600px;
            text-align: center;
        }

        img {
            width: 100px;
            height: 100px;
            background-color: dodgerblue;
            text-align: justify;
        }

        span {
            font-size: 20px;
            vertical-align: top;
        }

        .item1 {
            width: 150px;
            height: 150px;
            background-color: blue;
            display: inline-block;
            margin: 5px;
        }

        .item2 {
            width: 150px;
            height: 150px;
            background-color: red;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Excepturi assumenda veritatis adipisci? At eveniet
            provident, quisquam ratione fugit tempora natus saepe quod consequatur atque corrupti, doloremque, quae a
            ipsa ab.</p>
        <button>Lorem</button>
        <div>
            <img>
            <span> Exemplo vertical-align</span>
        </div>
        <div class="item1">Item 1</div>
        <div class="item2">Item 2</div>
    </div>
</body>

</html>
