<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3 - Cores</title>
</head>

<body>
    <!--Cabeçalho-->
    <header>
        <h1> Cores, imagens e links </h1>
    </header>
    <main>
        <!--Cores em HTML-->
        <section>
            <h2> Formatos de Cor no CSS </h2>
            <h3 style="color:#FF5733 ;">Título com cor em Hexadecimal</h3>
            <h3 style="color:rgb( 0, 128, 255) ;">Título com cor em RGB</h3>
            <h3 style="color:rgba(0, 128, 0, 0.6) ;">Título com cor em RGBA</h3>
        </section>
        <hr>
        <section>
            <p style="color: blue;">Texto com cor específica!</p>
            <p style="background-color: rgb(0 0 0);color:white;">Fundo do texto em uma cor específica</p>
        </section>
        <hr>
        <!--Imagem em outra pasta-->
        <section>
            <img src="assets/Kaiser.jpg" alt="Teste" title="Teste">
        </section>
        <hr>
        <!--Imagem como Background-->
        <section>
            <div style="border: 1px solid red; width: 500px;height: 500px; color: yellow; text-align: center;
             background-image: url('assets/Kaiser_2.jpg'); background-size: cover; background-repeat: no-repeat;
             background-position: center;">
                <h2>Imagem como Background</h2>
                <p> Esta seção tem uma imagem de fundo</p>
            </div>
        </section>
        <hr>
        <!--Videos internos-->
        <section>
            <h1>Videos em HTML</h1>
            <video src="assets/senai.mp4" controls autoplay muted Loop width="560" height="315">
                Seu navegador não suporta o elemento de video.
            </video>
        </section>
        <hr>
        <!--Videos Externos com iframe-->
        <section>
          <iframe width="560" height="315" src="https://www.youtube.com/embed/GQwOgb4XBNg?si=Xt7kEM1JcezYhrM1" 
          title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; 
          gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
    </main>
</body>

</html>
